<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
  <title>How a job travels on hoopoe</title>
  <desc>Illustration. You log in to the hoopoe head node, write a job script, and give it to Slurm with sbatch. Slurm waits until the requested machines are free, then runs the script on one of three partitions: LocalQ (CPU nodes node2 to node9), gpu (node01 with 8 A100 GPUs) or hgpuq (node10 with 8 H100 GPUs).</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#155e9b"/></marker>
  </defs>
  <rect width="1040" height="470" fill="#ffffff"/>
  <!-- your computer -->
  <rect x="24" y="170" width="170" height="120" rx="12" fill="#f7fafc" stroke="#9db4c4" stroke-width="2"/>
  <text x="109" y="215" text-anchor="middle" font-size="20" font-weight="700" fill="#172b3a">Your computer</text>
  <text x="109" y="244" text-anchor="middle" font-size="16" fill="#526574">terminal window</text>
  <line x1="196" y1="230" x2="262" y2="230" stroke="#155e9b" stroke-width="3" marker-end="url(#a)"/>
  <text x="229" y="216" text-anchor="middle" font-size="15" font-weight="650" fill="#155e9b">ssh</text>
  <!-- head node -->
  <rect x="266" y="140" width="220" height="180" rx="12" fill="#e9f3fa" stroke="#155e9b" stroke-width="2"/>
  <text x="376" y="180" text-anchor="middle" font-size="20" font-weight="700" fill="#172b3a">hoopoe</text>
  <text x="376" y="204" text-anchor="middle" font-size="16" fill="#526574">head node (login node)</text>
  <text x="376" y="240" text-anchor="middle" font-size="15" fill="#172b3a">copy files, edit,</text>
  <text x="376" y="262" text-anchor="middle" font-size="15" fill="#172b3a">submit and check jobs</text>
  <text x="376" y="296" text-anchor="middle" font-size="14" font-weight="650" fill="#8b5315">do not run CUBE here</text>
  <line x1="488" y1="230" x2="548" y2="230" stroke="#155e9b" stroke-width="3" marker-end="url(#a)"/>
  <text x="518" y="216" text-anchor="middle" font-size="15" font-weight="650" fill="#155e9b">sbatch</text>
  <!-- slurm -->
  <rect x="552" y="160" width="150" height="140" rx="12" fill="#fff6e9" stroke="#8b5315" stroke-width="2"/>
  <text x="627" y="202" text-anchor="middle" font-size="20" font-weight="700" fill="#172b3a">Slurm</text>
  <text x="627" y="228" text-anchor="middle" font-size="15" fill="#684115">the queue:</text>
  <text x="627" y="250" text-anchor="middle" font-size="15" fill="#684115">waits until the</text>
  <text x="627" y="272" text-anchor="middle" font-size="15" fill="#684115">machines are free</text>
  <!-- arrows to partitions -->
  <path d="M704 205 C 740 205 740 92 776 92" fill="none" stroke="#155e9b" stroke-width="3" marker-end="url(#a)"/>
  <line x1="704" y1="230" x2="776" y2="232" stroke="#155e9b" stroke-width="3" marker-end="url(#a)"/>
  <path d="M704 255 C 740 255 740 372 776 372" fill="none" stroke="#155e9b" stroke-width="3" marker-end="url(#a)"/>
  <!-- partitions -->
  <rect x="780" y="34" width="236" height="116" rx="12" fill="#edf7f2" stroke="#146b4a" stroke-width="2"/>
  <text x="798" y="68" font-size="19" font-weight="700" fill="#172b3a">LocalQ</text>
  <text x="798" y="95" font-size="15" fill="#174b37">node2 … node9</text>
  <text x="798" y="118" font-size="15" fill="#174b37">CPU only, 52 cores each</text>
  <text x="798" y="140" font-size="13" fill="#526574">cpu.sbatch</text>
  <rect x="780" y="174" width="236" height="116" rx="12" fill="#edf7f2" stroke="#146b4a" stroke-width="2"/>
  <text x="798" y="208" font-size="19" font-weight="700" fill="#172b3a">gpu</text>
  <text x="798" y="235" font-size="15" fill="#174b37">node01</text>
  <text x="798" y="258" font-size="15" fill="#174b37">8 × NVIDIA A100</text>
  <text x="798" y="280" font-size="13" fill="#526574">a100.sbatch</text>
  <rect x="780" y="314" width="236" height="116" rx="12" fill="#edf7f2" stroke="#146b4a" stroke-width="2"/>
  <text x="798" y="348" font-size="19" font-weight="700" fill="#172b3a">hgpuq</text>
  <text x="798" y="375" font-size="15" fill="#174b37">node10</text>
  <text x="798" y="398" font-size="15" fill="#174b37">8 × NVIDIA H100</text>
  <text x="798" y="420" font-size="13" fill="#526574">h100.sbatch, multigpu.sbatch</text>
  <text x="24" y="455" font-size="13" fill="#526574">Illustration. Partition = a named group of compute nodes. Node = one computer in the cluster.</text>
</svg>
